<html><head><meta charset="utf-8">

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const scene_ = q.get('scene') || 'hero';
const W = +q.get('w') || 1600, H = +q.get('h') || 1300;

for (const [w, s] of [['400','normal'],['800','normal'],['900','normal'],['900','italic']]) {
  const f = new FontFace('Nunito', `url(nunito-${w}${s==='italic'?'-italic':''}.woff2)`, { weight: w, style: s });
  document.fonts.add(await f.load());
}

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

const cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 100);

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-2.5, 9, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 8;
key.shadow.camera.left = -5; key.shadow.camera.right = 5; key.shadow.camera.top = 5; key.shadow.camera.bottom = -5;
scene.add(key);
const rim = new THREE.DirectionalLight(0xbfe3ff, 1.4); rim.position.set(5, 2, -4); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// Candy plastic: translucent, glossy, a little milky (the iMac's "Tangerine").
function candy(hex, opts = {}) {
  return new THREE.MeshPhysicalMaterial({
    color: hex, roughness: 0.12, metalness: 0, transmission: opts.transmission ?? 0.72, thickness: opts.thickness ?? 0.6,
    ior: 1.46, clearcoat: 1, clearcoatRoughness: 0.06, attenuationColor: new THREE.Color(hex), attenuationDistance: 0.9,
    specularIntensity: 1, sheen: 0.2, transparent: false,
  });
}
const chrome = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: 0.07, clearcoat: 1 });

function screenTexture() {
  const c = document.createElement('canvas'); c.width = 1400; c.height = 900;
  const g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 0, 900); bg.addColorStop(0, '#FFF8F1'); bg.addColorStop(1, '#FCE4D6');
  g.fillStyle = bg; g.fillRect(0, 0, 1400, 900);
  g.fillStyle = '#2A1714'; g.font = 'italic 900 92px Nunito'; g.fillText('Oiê', 70, 150);
  g.font = '800 44px Nunito'; g.fillStyle = '#6E5650'; g.fillText('Com quem você quer falar?', 70, 230);
  const people = [['Vó', '#E8573C'], ['Vô', '#2D5BFF'], ['Tia Bia', '#9BD12C'], ['Lucas', '#FF4FA0']];
  people.forEach(([n, col], i) => {
    const x = 70 + i * 325, y = 300;
    g.fillStyle = '#FFFFFF'; roundRect(g, x, y, 290, 520, 40); g.fill();
    // a soft, shaded "blob" face, like a 2000s avatar ball
    const cx = x + 145, cy = y + 190, r = 105;
    const rg = g.createRadialGradient(cx - 35, cy - 45, 10, cx, cy, r);
    rg.addColorStop(0, '#FFFFFF'); rg.addColorStop(0.25, col); rg.addColorStop(1, shade(col, -0.45));
    g.fillStyle = rg; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#2A1714';
    g.beginPath(); g.ellipse(cx - 30, cy - 8, 11, 15, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(cx + 30, cy - 8, 11, 15, 0, 0, Math.PI * 2); g.fill();
    g.lineWidth = 9; g.lineCap = 'round'; g.strokeStyle = '#2A1714';
    g.beginPath(); g.arc(cx, cy + 18, 30, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke();
    g.textAlign = 'center';
    g.fillStyle = '#2A1714'; g.font = '800 50px Nunito'; g.fillText(n, cx, y + 380);
    // ring dot on Vó: she's calling
    if (i === 0) { g.fillStyle = '#E8573C'; roundRect(g, x + 60, y + 420, 170, 64, 32); g.fill(); g.fillStyle = '#fff'; g.font = '800 34px Nunito'; g.fillText('Trim!', cx, y + 464); }
    g.textAlign = 'left';
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function stripes(hex) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 8; const g = c.getContext('2d');
  for (let x = 0; x < 512; x += 8) { g.fillStyle = 'rgba(255,255,255,0.55)'; g.fillRect(x, 0, 3, 8); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, 1); return t;
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function shade(hex, k) { const c = new THREE.Color(hex); c.offsetHSL(0, 0, k * 0.5); return '#' + c.getHexString(); }

function floor() {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.22 }));
  p.rotation.x = -Math.PI / 2; p.receiveShadow = true; scene.add(p);
}

if (scene_ === 'hero') {
  const tablet = new THREE.Group();
  const TANG = 0xFF6A2B;
  // outer candy shell: translucent, with a deep iMac-style chin where the guts show through
  const shell = new THREE.Mesh(new RoundedBoxGeometry(3.5, 2.75, 0.42, 10, 0.2), candy(TANG, { transmission: 0.92, thickness: 0.35 }));
  shell.position.y = -0.18; shell.castShadow = true; tablet.add(shell);
  // inside the shell: a white inner frame, the stripes, a green board with chips and a speaker
  const inner = new THREE.Mesh(new RoundedBoxGeometry(3.18, 2.1, 0.16, 6, 0.08), new THREE.MeshStandardMaterial({ color: 0xF3EEE8, roughness: 0.5 }));
  inner.position.z = 0.02; tablet.add(inner);
  const st = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 2.6), new THREE.MeshBasicMaterial({ map: stripes(), transparent: true, opacity: 0.5, depthWrite: false }));
  st.position.set(0, -0.18, -0.17); tablet.add(st);
  const board = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.32, 0.03), new THREE.MeshStandardMaterial({ color: 0x1E6B3A, roughness: 0.5 }));
  board.position.set(0, -1.3, -0.02); tablet.add(board);
  [[-0.9, 0x222222, 0.36], [-0.35, 0xC9C9C9, 0.18], [0.1, 0x222222, 0.24], [0.6, 0xD4A23A, 0.14]].forEach(([x, c, w]) => {
    const chip = new THREE.Mesh(new THREE.BoxGeometry(w, 0.16, 0.06), new THREE.MeshStandardMaterial({ color: c, roughness: 0.35, metalness: c === 0xC9C9C9 ? 1 : 0.2 }));
    chip.position.set(x, -1.3, 0.03); tablet.add(chip);
  });
  const spk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.05, 40), chrome); spk.rotation.x = Math.PI / 2; spk.position.set(1.05, -1.3, 0.03); tablet.add(spk);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(2.98, 1.92), new THREE.MeshBasicMaterial({ map: screenTexture(), toneMapped: false }));
  screen.position.z = 0.215; tablet.add(screen);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(2.98, 1.92), new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.02, metalness: 0, clearcoat: 1, transparent: true, opacity: 0.12 }));
  glass.position.z = 0.218; tablet.add(glass);
  // a chrome foot
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 1.0, 0.1, 64), chrome);
  foot.position.set(0, -1.72, -0.35); foot.castShadow = true;
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.4, 32), chrome);
  neck.position.set(0, -1.5, -0.35); tablet.add(foot, neck);
  // the cord's socket on the right side
  const sock = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.12, 24), chrome); sock.rotation.z = Math.PI / 2; sock.position.set(1.78, -1.05, 0); tablet.add(sock);
  tablet.rotation.set(-0.06, -0.38, 0);
  tablet.position.set(-0.45, 0.2, 0);
  scene.add(tablet);
  tablet.updateMatrixWorld(true);
  const sockW = sock.getWorldPosition(new THREE.Vector3());

  // the handset: a classic home-phone receiver, same candy plastic, just picked up
  const hs = new THREE.Group();
  const path = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.8, -0.2, 0), new THREE.Vector3(-0.55, 0.08, 0), new THREE.Vector3(0, 0.16, 0),
    new THREE.Vector3(0.55, 0.08, 0), new THREE.Vector3(0.8, -0.2, 0)]);
  const grip = new THREE.Mesh(new THREE.TubeGeometry(path, 80, 0.13, 32, false), candy(TANG, { transmission: 0.8 }));
  grip.castShadow = true; hs.add(grip);
  const ends = [];
  for (const sx of [-1, 1]) {
    const cup = new THREE.Mesh(new THREE.SphereGeometry(0.3, 48, 32), candy(TANG, { transmission: 0.8 }));
    cup.scale.set(1, 0.72, 0.62); cup.position.set(sx * 0.86, -0.36, 0); cup.castShadow = true; hs.add(cup);
    const grille = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.2, 0.04, 40), chrome);
    grille.position.set(sx * 0.86, -0.56, 0); hs.add(grille);
    ends.push(cup);
  }
  hs.scale.setScalar(0.9);
  hs.position.set(2.05, 1.95, 0.8);
  hs.rotation.set(0.45, -0.3, 0.5);
  scene.add(hs); hs.updateMatrixWorld(true);
  const hsEnd = ends[1].getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0.05, -0.2, 0));

  // the curly cord, lime candy, from the handset down to the tablet's side
  const pts = [];
  const a = hsEnd, b = sockW;
  const n = 900, turns = 22, rr = 0.09;
  const dir = new THREE.Vector3().subVectors(b, a); const len = dir.length(); dir.normalize();
  const u = new THREE.Vector3(0, 0, 1).cross(dir).normalize(); const v = new THREE.Vector3().crossVectors(dir, u);
  for (let i = 0; i <= n; i++) {
    const t = i / n; const sag = Math.sin(t * Math.PI) * 0.45;
    const p = a.clone().addScaledVector(dir, t * len).add(new THREE.Vector3(0.35 * sag, -sag, 0.25 * sag));
    const ang = t * turns * Math.PI * 2;
    const ramp = Math.min(1, t * 12, (1 - t) * 12);
    p.addScaledVector(u, Math.cos(ang) * rr * ramp).addScaledVector(v, Math.sin(ang) * rr * ramp);
    pts.push(p);
  }
  const cord = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 2400, 0.026, 12, false), candy(0x9BD12C, { transmission: 0.35 }));
  cord.castShadow = true; scene.add(cord);

  floor(); scene.children.at(-1).position.y = -1.37;
  cam.position.set(0.5, 1.3, 11.5); cam.lookAt(0.75, 0.15, 0);
}

if (scene_ === 'blob-chrome' || scene_ === 'blob-candy' || scene_ === 'bubble') {
  const geo = new THREE.IcosahedronGeometry(1, 64);
  const pos = geo.attributes.position; const v = new THREE.Vector3();
  const seed = +(q.get('seed') || 1);
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const d = scene_ === 'bubble' ? 0.03 : 0.22;
    const k = 1 + d * Math.sin(v.x * 2.1 + seed) * Math.cos(v.y * 1.7 + seed * 2) + d * 0.6 * Math.sin(v.z * 2.6 + seed * 3);
    v.multiplyScalar(k); pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  let mat;
  // classic Y2K chrome: a sky-blue top, a hard dark horizon, a warm ground, all reflected
  const ec = document.createElement('canvas'); ec.width = 1024; ec.height = 512; const eg = ec.getContext('2d');
  const gr = eg.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#2B4CFF'); gr.addColorStop(0.32, '#BFD8FF'); gr.addColorStop(0.47, '#FFFFFF'); gr.addColorStop(0.5, '#1A1530');
  gr.addColorStop(0.56, '#6B4A3A'); gr.addColorStop(0.8, '#E9C9A8'); gr.addColorStop(1, '#FFF4E6');
  eg.fillStyle = gr; eg.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 6; i++) { eg.fillStyle = 'rgba(255,255,255,0.9)'; eg.fillRect(120 + i * 150, 90 + (i % 2) * 40, 60, 110); }
  const et = new THREE.CanvasTexture(ec); et.mapping = THREE.EquirectangularReflectionMapping; et.colorSpace = THREE.SRGBColorSpace;
  scene.environment = et;
  if (scene_ === 'blob-chrome') mat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: 0.04, clearcoat: 1 });
  else if (scene_ === 'bubble') mat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0, metalness: 0.15, transparent: true, opacity: 0.55, iridescence: 1, iridescenceIOR: 1.8, iridescenceThicknessRange: [250, 1100], clearcoat: 1, specularIntensity: 1 });
  else mat = candy(+(q.get('color') || 0x9BD12C), { transmission: 0.6 });
  const m = new THREE.Mesh(geo, mat); m.rotation.set(0.4, 0.6, 0.1); scene.add(m);
  cam.position.set(0, 0, 6.2); cam.lookAt(0, 0, 0);
}

if (scene_ === 'phone') {
  const c = document.createElement('canvas'); c.width = 600; c.height = 1240; const g = c.getContext('2d');
  g.fillStyle = '#0E0E14'; g.fillRect(0, 0, 600, 1240);
  // an endless feed: grey blocks
  for (let y = 40; y < 1240; y += 230) { g.fillStyle = '#2A2A36'; roundRect(g, 30, y, 540, 200, 24); g.fill(); g.fillStyle = '#3B3B4A'; roundRect(g, 50, y + 20, 120, 120, 60); g.fill(); g.fillRect(190, y + 40, 300, 22); g.fillRect(190, y + 80, 220, 22); }
  // pop-up windows, the old web's kind
  const pops = [['ANÚNCIO!', 'Clique aqui e ganhe!', 40, 120, -0.06, '#FF2E88'], ['COMPRE JÁ!', 'Só hoje: 3 por 2', 120, 430, 0.05, '#2D5BFF'], ['Quem é você?', 'Oi, me add aí?', 30, 740, -0.03, '#7A2CC9'], ['FEED SEM FIM', 'Role mais um pouco…', 110, 960, 0.04, '#0E8F5E']];
  for (const [t, b, x, y, r, col] of pops) {
    g.save(); g.translate(x + 220, y + 110); g.rotate(r); g.translate(-220, -110);
    g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(10, 12, 440, 220);
    g.fillStyle = '#D4D0C8'; g.fillRect(0, 0, 440, 220);
    g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, 440, 4); g.fillRect(0, 0, 4, 220);
    g.fillStyle = '#404040'; g.fillRect(436, 0, 4, 220); g.fillRect(0, 216, 440, 4);
    const tb = g.createLinearGradient(0, 0, 440, 0); tb.addColorStop(0, col); tb.addColorStop(1, '#101060');
    g.fillStyle = tb; g.fillRect(8, 8, 424, 50);
    g.fillStyle = '#fff'; g.font = '900 30px Nunito'; g.fillText(t, 22, 44);
    g.fillStyle = '#D4D0C8'; g.fillRect(384, 16, 36, 34); g.fillStyle = '#000'; g.font = '900 26px Nunito'; g.fillText('×', 393, 43);
    g.fillStyle = '#000'; g.font = '800 30px Nunito'; g.fillText(b, 26, 120);
    g.fillStyle = '#D4D0C8'; g.fillRect(150, 150, 140, 48); g.strokeStyle = '#000'; g.lineWidth = 2; g.strokeRect(150, 150, 140, 48);
    g.fillStyle = '#000'; g.font = '800 26px Nunito'; g.fillText('OK', 200, 184);
    g.restore();
  }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const ph = new THREE.Group();
  const body = new THREE.Mesh(new RoundedBoxGeometry(1.55, 3.1, 0.16, 8, 0.14), new THREE.MeshPhysicalMaterial({ color: 0x111116, roughness: 0.15, metalness: 0.4, clearcoat: 1 }));
  body.castShadow = true; ph.add(body);
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(1.42, 2.94), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
  scr.position.z = 0.082; ph.add(scr);
  ph.rotation.set(-0.1, 0.42, 0.12); scene.add(ph);
  floor(); scene.children.at(-1).position.y = -1.7;
  cam.position.set(0, 0.6, 9); cam.lookAt(0, 0, 0);
}

renderer.render(scene, cam);
window.__done = true;
</script></body></html>
