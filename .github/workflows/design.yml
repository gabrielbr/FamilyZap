name: design
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Design tokens check (layers, brand, contrast, generated files)
        run: python3 design/build.py --check
