name: release
# Push a tag v<x.y.z> (matching versionName) to publish a signed APK and SHA256SUMS.txt as a GitHub release.
# Self-update installs only an APK whose SHA-256 is in SHA256SUMS.txt and whose key matches the installed app.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key from secrets
        env:
          OIE_KEYSTORE_BASE64: ${{ secrets.OIE_KEYSTORE_BASE64 }}
        run: |
          test -n "$OIE_KEYSTORE_BASE64" || { echo "Add the OIE_KEYSTORE_* secrets first (docs/release.md)"; exit 1; }
          echo "$OIE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/oie.jks"
          echo "OIE_KEYSTORE_FILE=$RUNNER_TEMP/oie.jks" >> "$GITHUB_ENV"
      - name: Tag matches versionName
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match versionName $v"; exit 1; }
      - name: Test and build the signed release
        env:
          OIE_KEYSTORE_PASSWORD: ${{ secrets.OIE_KEYSTORE_PASSWORD }}
          OIE_KEY_ALIAS: ${{ secrets.OIE_KEY_ALIAS }}
          OIE_KEY_PASSWORD: ${{ secrets.OIE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest verifyRoborazziDebug lintDebug assembleRelease
      - name: APK and SHA256SUMS.txt
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Oie-${GITHUB_REF_NAME#v}.apk"
          cd dist && sha256sum Oie-*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release to the public releases repo
        # Self-update reads gabrielbr/oie-releases (public); the code stays private. OIE_RELEASES_TOKEN is a
        # fine-grained token with Contents: read and write on that one repo only (docs/release.md).
        env:
          GH_TOKEN: ${{ secrets.OIE_RELEASES_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Add the OIE_RELEASES_TOKEN secret first (docs/release.md)"; exit 1; }
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | head -40)
          gh release create "$GITHUB_REF_NAME" dist/* --repo gabrielbr/oie-releases --title "Oiê ${GITHUB_REF_NAME#v}" --notes "$notes"
