name: retrace (temporary, removed before merge)
# Rebuilds v0.57.0's R8 map on a runner like the release one, and retraces issue #88's crash frames.
on:
  push:
    branches: [ccr-9ff9ec94-9hcffp]
    paths: [".github/workflows/retrace-tmp.yml", ".github/retrace/**"]
jobs:
  retrace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: tool }
      - uses: actions/checkout@v4
        with: { ref: v0.57.0, path: src }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: src/link/go.mod, cache-dependency-path: src/link/go.sum }
      - name: Link and R8
        working-directory: src
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-37.1" > /dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          link/build-aar.sh
          ./gradlew --no-daemon -q assembleRelease
          find app/build -name 'mapping*.txt' | head
          M=$(find app/build -name mapping.txt | head -1); cp "$M" "$GITHUB_WORKSPACE/mapping.txt"; head -6 "$GITHUB_WORKSPACE/mapping.txt"
      - uses: actions/upload-artifact@v4
        with: { name: mapping-0.57.0, path: mapping.txt, retention-days: 90 }
      - name: Retrace
        run: |
          M=mapping.txt
          R8=$(find ~/.gradle/caches -name 'r8-*.jar' -o -name 'builder-*.jar' | grep -E '/r8-[0-9]' | head -1)
          echo "R8: $R8"
          java -cp "$R8" com.android.tools.r8.retrace.Retrace $M tool/.github/retrace/stack.txt || true
          echo "---- the classes"
          for c in x81 y11 br2 h81 ta1 n22 gm0 sl1 ct2 tl1 rl1 m7 n81 nc1 r10 cu1 f80 u10 wi2 vi2 m9; do grep -E "^[^ #].* -> $c:$" $M || echo "$c ?"; done
