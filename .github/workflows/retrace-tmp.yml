name: retrace (temporary, removed before merge)
# Rebuilds v0.57.0's R8 map on a runner like the release one, and retraces issue #88's crash frames.
on:
  push:
    branches: [ccr-9ff9ec94-9hcffp]
    paths: [".github/workflows/retrace-tmp.yml", ".github/retrace/**"]
jobs:
  retrace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: tool }
      - uses: actions/checkout@v4
        with: { ref: v0.57.0, path: src }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: src/link/go.mod, cache-dependency-path: src/link/go.sum }
      - name: Link and R8
        working-directory: src
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-37.1" > /dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          link/build-aar.sh
          ./gradlew --no-daemon -q :app:minifyReleaseWithR8
          head -6 app/build/outputs/mapping/release/mapping.txt
      - uses: actions/upload-artifact@v4
        with: { name: mapping-0.57.0, path: src/app/build/outputs/mapping/release/mapping.txt, retention-days: 90 }
      - name: Retrace
        run: |
          M=src/app/build/outputs/mapping/release/mapping.txt
          V=$(grep -oP '^# compiler_version: \K.*' $M)
          curl -sfL -o r8.jar "https://dl.google.com/android/maven2/com/android/tools/r8/$V/r8-$V.jar"
          java -cp r8.jar com.android.tools.r8.retrace.Retrace $M tool/.github/retrace/stack.txt
          echo "---- the classes"
          for c in x81 y11 br2 h81 ta1 n22 gm0 sl1 ct2 tl1 rl1 m7 n81 nc1 r10 cu1 f80 u10 wi2 vi2 m9; do grep -E "^[^ #].* -> $c:$" $M || echo "$c ?"; done
