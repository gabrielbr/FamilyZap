name: app
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generated tokens match the app's copy
        run: diff design/generated/OTokens.kt app/src/main/java/app/oie/ui/theme/OTokens.kt
      - name: Unit tests, screenshot tests, lint, build
        run: ./gradlew --no-daemon testDebugUnitTest verifyRoborazziDebug lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oie-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
