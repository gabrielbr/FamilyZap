name: app
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generated tokens match the app's copy
        run: diff design/generated/OTokens.kt app/src/main/java/app/oie/ui/theme/OTokens.kt
      - uses: actions/setup-go@v5
        with:
          go-version-file: link/go.mod
          cache-dependency-path: link/go.sum
      - name: The WhatsApp link library (link/, gomobile)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          link/build-aar.sh
      - name: Unit tests, screenshot tests, lint, build
        run: ./gradlew --no-daemon testDebugUnitTest verifyRoborazziDebug lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oie-debug
          path: |
            app/build/outputs/apk/debug/app-universal-debug.apk
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
